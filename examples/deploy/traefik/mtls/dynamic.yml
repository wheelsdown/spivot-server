# Traefik dynamic configuration for the Spivot mTLS deployment.
# Referenced by docker-compose.yml via the file provider.

tls:
  options:
    # spivot-mtls is the TLS options profile the spivot router
    # applies via `tls.options=spivot-mtls@file`. It pins TLS 1.3
    # and turns the connection into an mTLS-capable one: clients
    # MAY present a certificate; if they do, it must verify against
    # the Spivot CA.
    spivot-mtls:
      minVersion: VersionTLS13
      clientAuth:
        caFiles:
          # Path inside the Traefik container; the host file is
          # mounted from ./ca/spivot-ca.crt in docker-compose.yml.
          - /etc/traefik/spivot-ca.crt
        # RequestClientCert (not RequireAndVerifyClientCert) is
        # deliberate: the enrollment endpoint
        # (POST /v1/client-apps/enroll) must accept connections
        # without a client cert so a new device can present its
        # invite + CSR. Routes that require an enrolled identity
        # are gated at the application layer
        # (middleware.RequireIdentity / RequireSession); a
        # request without a verified client cert reaches those
        # handlers and gets 401 — which is the correct UX.
        clientAuthType: RequestClientCert

http:
  middlewares:
    # passTLSClientCert forwards the verified client certificate to
    # the backend via two headers the proxy package recognizes:
    #
    #   X-Forwarded-Tls-Client-Cert       URL-encoded PEM of the leaf
    #   X-Forwarded-Tls-Client-Cert-Info  structured subject / serial / NotAfter
    #
    # The server uses either path to surface a `proxy.ClientCert`
    # to the identity middleware, which resolves the cert serial
    # to an enrolled (user_id, client_app_id).
    spivot-pass-client-cert:
      passTLSClientCert:
        pem: true
        info:
          notAfter: true
          serialNumber: true
          subject:
            commonName: true
            organization: true
