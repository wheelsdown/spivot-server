services:
  spivot-server:
    image: ghcr.io/wheelsdown/spivot-server:${SPIVOT_IMAGE_TAG:?set SPIVOT_IMAGE_TAG to a release tag}
    restart: unless-stopped
    environment:
      SPIVOT_ADDR: 0.0.0.0
      SPIVOT_PORT: "8080"
      SPIVOT_PUBLIC_URL: ${SPIVOT_PUBLIC_URL:?set SPIVOT_PUBLIC_URL}
      SPIVOT_TRUST_PROXY: "true"
      SPIVOT_TRUSTED_PROXY_CIDRS: ${SPIVOT_TRUSTED_PROXY_CIDRS}
      SPIVOT_LOG_FORMAT: ${SPIVOT_LOG_FORMAT:-json}
    expose:
      - "8080"
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/spivot-server
        - healthcheck
        - -url
        - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    # Add local reverse-proxy labels here, or keep them in a deployment overlay.

networks:
  edge:
    external: true
    name: ${SPIVOT_EDGE_NETWORK:-traefik}
