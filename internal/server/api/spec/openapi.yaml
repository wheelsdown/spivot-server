        - mutualTLS: []
      x-spivot-auth:
        posture: identity
    get:
      operationId: garageInviteList
      summary: List garage invites
      tags:
        - Garages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GarageInviteListResponse'
        default:
          description: Failure; the problem envelope's `code` identifies the cause.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
      security:
        - mutualTLS: []
      x-spivot-auth:
        posture: identity
  /v1/garages/{id}/invites/{inviteId}/revoke:
    post:
      operationId: garageInviteRevoke
      summary: Revoke a garage invite
      tags:
        - Garages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          description: Failure; the problem envelope's `code` identifies the cause.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
      security:
        - mutualTLS: []
      x-spivot-auth:
        posture: identity
  /v1/garage-invites/redeem:
    post:
      operationId: garageInviteRedeem
      summary: Redeem a garage invite token
      tags:
        - Garages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GarageInviteRedeemRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GarageInviteRedeemResponse'
        default:
          description: Failure; the problem envelope's `code` identifies the cause.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
      security:
        - mutualTLS: []
      x-spivot-auth:
        posture: identity
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: An enrolled client-app certificate, presented directly via mTLS or forwarded by a trusted edge proxy. Obtained from `clientAppEnroll`.
    macaroonSession:
      type: http
      scheme: macaroon
      description: '`Authorization: Macaroon <token>` — a base64url session macaroon minted by `sessionCreate`, carrying user/client-app/action caveats and, for journey-scoped operations, a journey caveat that must match the journey named in the request path.'
  schemas:
    RootResponse:
      description: RootResponse is the identity banner served at GET /.
      type: object
      properties:
        name:
          description: Name is the human-readable server product name.
          type: string
        version:
          description: Version is the running spivot-server release version.
          type: string
        status:
          description: Status is "ok" whenever the process is serving requests.
          type: string
        public_url:
          description: |-
            PublicURL is the canonical URL served by the edge proxy.
            Omitted when no public URL is configured.
          type: string
      required:
        - name
        - version
        - status
    ProblemResponse:
      description: |-
        ProblemResponse is the error envelope every failure response
        carries, following the spirit of RFC 7807 (application/problem+json)
        so clients see a structured, parseable failure rather than a
        free-form string. The generated OpenAPI document references it as
        every operation's default (non-2xx) response.
      type: object
      properties:
        status:
          description: Status echoes the HTTP status code of the response.
          type: integer
          format: int64
          readOnly: true
          example: 400
        code:
          description: |-
            Code is the stable machine-readable failure identifier
            (snake_case, for example "invalid_request" or
            "journey_not_found"). Branch on this, not on Detail.
          type: string
          readOnly: true
          example: invalid_request
        detail:
          description: |-
            Detail is the human-readable explanation of this occurrence
            of the failure. Wording may change between releases.
          type: string
          readOnly: true
      required:
        - status
        - code
        - detail
    HealthResponse:
      description: HealthResponse is the liveness payload served at GET /health.
      type: object
      properties:
        status:
          description: Status is "healthy" whenever the process is serving requests.
          type: string
        version:
          description: Version is the running spivot-server release version.
          type: string
        uptime:
          description: Uptime is the process uptime as a Go duration string.
          type: string
      required:
        - status
        - version
        - uptime
    ReadinessResponse:
      description: |-
        ReadinessResponse is the readiness payload served at GET /readyz.
        Status is "ready" with a 200 when the backing store answers a ping
        (or none is wired), "unready" with a 503 when it does not.
      type: object
      properties:
        status:
          description: Status is "ready" or "unready".
          type: string
        version:
          description: Version is the running spivot-server release version.
          type: string
      required:
        - status
        - version
    ServerInfoResponse:
      description: |-
        ServerInfoResponse is the discovery document served at GET
        /v1/server: who this server is, what implementation and protocol
        version it runs, what capabilities it advertises, and the policy
        snapshot journeys created here are pinned to.
      type: object
      properties:
        name:
          description: Name is the human-readable server product name.
          type: string
        public_url:
          description: |-
            PublicURL is the canonical URL served by the edge proxy.
            Omitted when no public URL is configured.
          type: string
        implementation:
          description: Implementation identifies the server software build.
          allOf:
            - $ref: '#/components/schemas/ImplementationInfo'
        protocol:
          description: |-
            Protocol identifies the OpenCaravan wire-format version the
            server speaks.
          allOf:
            - $ref: '#/components/schemas/ProtocolInfo'
        capabilities:
          description: Capabilities advertises what this deployment supports.
          allOf:
            - $ref: '#/components/schemas/ServerCapabilities'
        policy:
          description: |-
            Policy is the policy snapshot journeys created on this server
            are pinned to.
          allOf:
            - $ref: '#/components/schemas/ServerPolicySnapshot'
      required:
        - name
        - implementation
        - protocol
        - capabilities
        - policy
    ImplementationInfo:
      description: |-
        ImplementationInfo identifies the server software build advertised
        at GET /v1/server.
      type: object
      properties:
        name:
          description: Name is the implementation identifier ("spivot-server").
          type: string
        version:
          description: Version is the release version injected at build time.
          type: string
        commit:
          description: Commit is the short git commit hash the binary was built from.
          type: string
        build_time:
          description: BuildTime is the UTC build timestamp (RFC 3339).
          type: string
      required:
        - name
        - version
        - commit
        - build_time
    ProtocolInfo:
      description: |-
        ProtocolInfo identifies the OpenCaravan wire-format version this
        server implements.
      type: object
      properties:
        name:
          description: Name is the protocol identifier ("OpenCaravan").
          type: string
        version:
          description: |-
            Version is the OpenCaravan wire-format version. Pre-1.0, a
            bump signals "expect change"; 1.0 freezes the wire format.
          type: string
      required:
        - name
        - version
    ServerCapabilities:
      description: |-
        ServerCapabilities is a convenience projection from ServerPolicyDocument plus
        concrete implementation state. Keep policy-backed fields derived in
        serverCapabilitiesFromPolicy so the advertised policy remains the source of
        truth.
      type: object
      properties:
        registration:
          description: Registration describes how users join this server.
          allOf:
            - $ref: '#/components/schemas/RegistrationCapabilities'
        journeys:
          description: Journeys describes the journey behavior this server supports.
          allOf:
            - $ref: '#/components/schemas/JourneyCapabilities'
        data:
          description: Data describes data retention and storage behavior.
          allOf:
            - $ref: '#/components/schemas/DataCapabilities'
      required:
        - registration
        - journeys
        - data
    RegistrationCapabilities:
      description: RegistrationCapabilities describes how users join this server.
      type: object
      properties:
        mode:
          description: Mode identifies the registration model ("invite_only").
          type: string
        mint_policy:
          description: |-
            MintPolicy advertises who may mint server_registration invites via
            POST /v1/client-apps/invites (denied | admin-only | any-user). It
            is a runtime, server-wide capability deliberately kept OUT of the
            content-addressed policy document: the document's hash pins
            journey provenance, and a mutable authz toggle must not churn it.
            Clients use this to show/hide an "invite a user" affordance; under
            admin-only a non-admin still sees "admin-only" and learns "not me"
            only on the 403 (a per-caller can_mint signal is future work).
          type: string
      required:
        - mode
        - mint_policy
    JourneyCapabilities:
      description: |-
        JourneyCapabilities describes the journey behavior this server
        supports.
      type: object
      properties:
        invite_only:
          description: |-
            InviteOnly reports whether journeys are discoverable only by
            invitation.
          type: boolean
        invite_links:
          description: |-
            InviteLinks reports whether journeys can create shareable
            invite links.
          type: boolean
        invite_use_limits:
          description: |-
            InviteUseLimits reports whether invite use counts are
            supported.
          type: boolean
        deletion_time_per_item:
          description: |-
            DeletionTimePerItem reports whether retained data deletion is
            selected per journey via its deletion time.
          type: boolean
      required:
        - invite_only
        - invite_links
        - invite_use_limits
        - deletion_time_per_item
    DataCapabilities:
      description: DataCapabilities describes data retention and storage behavior.
      type: object
      properties:
        sqlite_storage:
          description: SQLiteStorage reports whether the server persists to SQLite.
          type: boolean
        telemetry_storage:
          description: |-
            TelemetryStorage reports whether individual telemetry samples
            are expanded into queryable storage (Phase 5 stores only the
            batch envelope).
          type: boolean
        image_resource_upload:
          description: |-
            ImageResourceUpload reports whether uploaded image resources
            are accepted and served.
          type: boolean
      required:
        - sqlite_storage
        - telemetry_storage
        - image_resource_upload
    ServerPolicySnapshot:
      description: ServerPolicySnapshot describes the policy snapshot advertised by this server.
      type: object
      properties:
        id:
          description: ID is the server-local policy snapshot identifier.
          type: string
        policy_hash:
          description: |-
            Hash is the server-local content hash of the internally normalized policy
            document. It is not an RFC 8785 JSON Canonicalization Scheme hash.
          type: string
        created_time:
          description: CreatedTime is the RFC3339 UTC time when the snapshot was first recorded.
          type: string
        document:
          description: Document is the internally normalized JSON policy document.
      required:
        - id
        - policy_hash
        - created_time
        - document
    VersionResponse:
      description: |-
        VersionResponse is the build/runtime detail served at GET
        /v1/version: the same information [buildinfo.RuntimeInfo] reports
        on the CLI, as a typed wire contract.
      type: object
      properties:
        version:
          description: Version is the release version injected at build time.
          type: string
        git_commit:
          description: GitCommit is the short commit hash the binary was built from.
          type: string
        git_branch:
          description: GitBranch is the branch the binary was built from.
          type: string
        build_time:
          description: BuildTime is the UTC build timestamp (RFC 3339).
          type: string
        go_version:
          description: GoVersion is the Go toolchain that produced the binary.
          type: string
        os:
          description: OS is the runtime operating system (GOOS).
          type: string
        arch:
          description: Arch is the runtime architecture (GOARCH).
          type: string
        uptime:
          description: Uptime is the process uptime as a Go duration string.
          type: string
      required:
        - version
        - git_commit
        - git_branch
        - build_time
        - go_version
        - os
        - arch
        - uptime
    ClientAppEnrollmentRequest:
      description: |-
        ClientAppEnrollmentRequest is the wire format an app sends to enroll a new
        ClientApp and obtain its credentialing ClientAppEnrollment.

        The app presents a one-shot InviteToken (server_registration scope), a
        CSR carrying its locally-generated public key, an optional human-readable
        display name, and an optional KeyAttestation. The server validates the
        invite, validates the CSR, signs the leaf certificate, and returns a
        ClientAppEnrollmentResponse.
      type: object
      properties:
        type:
          type: string
        version:
          type: integer
          format: int64
        invite_token:
          type: string
        csr_pem:
          description: |-
            CSRPEM is the PEM-encoded PKCS#10 certificate signing request. The
            protocol requires PKCS#10 with a P-256 ECDSA public key, but parsing
            and policy enforcement is implementation-level: this Validate only
            checks that CSRPEM is a CERTIFICATE REQUEST PEM block.
          type: string
        display_name:
          type: string
        key_attestation:
          description: |-
            KeyAttestation is optional. When present, it proves the CSR's private
            key resides in platform-managed hardware storage. Servers may make
            attestation required for some scopes.
          anyOf:
            - $ref: '#/components/schemas/KeyAttestation'
            - type: "null"
      required:
        - type
        - version
        - invite_token
        - csr_pem
    KeyAttestation:
      description: |-
        KeyAttestation carries an opaque platform-specific attestation that the
        client's signing key resides in hardware-backed storage.

        The protocol declares the slot; it does not verify the data. Servers may
        require an attestation of a specific format for high-trust scopes and
        invoke a format-specific verifier on the Data payload. Apps that lack
        hardware-backed storage omit KeyAttestation entirely.
      type: object
      properties:
        format:
          type: string
        data:
          description: |-
            Data carries a format-specific payload encoded as RFC 4648 standard
            base64 with padding. Standard base64 (rather than base64url) matches
            the conventions of the major attestation toolchains on iOS and
            Android; WebAuthn callers that produce base64url-encoded attestations
            re-encode at this protocol boundary.
          type: string
      required:
        - format
        - data
    ClientAppEnrollmentResponse:
      description: |-
        ClientAppEnrollmentResponse is the server's reply to a successful
        ClientAppEnrollmentRequest. It carries the freshly-issued enrollment record
        and the server's CA chain so the app can pin the issuer for future
        validations.
      type: object
      properties:
        type:
          type: string
        version:
          type: integer
          format: int64
        enrollment:
          description: |-
            Enrollment is the issued certificate record. Enrollment.ID is also the
            new ClientApp.ID; the app records both records under the same ID.
          allOf:
            - $ref: '#/components/schemas/ClientAppEnrollment'
        server_ca_chain:
          description: |-
            ServerCAChain is the chain of issuer certificates above the leaf in
            Enrollment.CertificateChain, root last. Apps pin the root for offline
            peer-to-peer validation against other enrolled apps on the same server.
          type: array
          items:
            type: string
      required:
        - type
        - version
        - enrollment
        - server_ca_chain
    ClientAppEnrollment:
      description: |-
        ClientAppEnrollment is the cryptographic credential record paired with a
        ClientApp. Each enrollment has the same ID as the ClientApp it credentials,
        so a ClientApp and a ClientAppEnrollment are two faces of one entity: the
        ClientApp describes who/what the installation is, and the
        ClientAppEnrollment carries the certificate chain that proves the
        installation controls a registered private key.

        The public key is intentionally omitted from this record. It is already
        inside CertificateChain[0] and derivable. Callers that need the public key
        outside an enrollment context use PublicKey directly.
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        certificate_chain:
          description: |-
            CertificateChain is the issued certificate chain, leaf first. The leaf
            certificate's subject identifies the ClientApp and its public key is the
            device's signing key.
          type: array
          items:
            type: string
        issued_time:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - certificate_chain
        - issued_time
        - not_after
    SessionRequest:
      description: |-
        SessionRequest is the wire format a client app sends, over an
        mTLS-authenticated transport, to request a session macaroon.

        JourneyID is optional; a session without a journey ID grants actions that
        do not require a journey context (such as creating a journey or reading the
        caller's own profile). LifetimeSeconds is a hint — the server may issue a
        macaroon with a shorter lifetime than requested.
      type: object
      properties:
        type:
          type: string
        version:
          type: integer
          format: int64
        journey_id:
          type:
            - string
            - "null"
        actions:
          type: array
          items:
            type: string
        lifetime_seconds:
          type: integer
          format: int64
      required:
        - type
        - version
        - actions
        - lifetime_seconds
    SessionResponse:
      description: |-
        SessionResponse is the server's reply to a SessionRequest, carrying the
        issued macaroon and its expiration time.

        Macaroon carries the binary macaroon serialization defined by the macaroon
        spec (https://research.google/pubs/macaroons-cookies-with-contextual-caveats-for-decentralized-authorization/)
        encoded as unpadded base64url so it travels safely in HTTP headers, JSON
        payloads, and URL query strings without escaping. OpenCaravan defines only
        the caveat predicate namespace used inside the macaroon (see CaveatKind and
        the CaveatX builders); the macaroon binary format itself is out of scope
        for this protocol package.

        The ExpirationTime field duplicates the time<T caveat inside the macaroon
        so clients can show expiry without having to parse the macaroon body.
      type: object
      properties:
        type:
          type: string
        version:
          type: integer
          format: int64
        macaroon:
          type: string
        expiration_time:
          type: string
          format: date-time
      required:
        - type
        - version
        - macaroon
        - expiration_time
    ClientAppInviteCreateRequest:
      description: |-
        ClientAppInviteCreateRequest is the optional POST body. An empty body
        (or no Content-Length) is valid and selects the defaults.
      type: object
      properties:
        expires_in_seconds:
          description: |-
            ExpiresInSeconds is the requested invite lifetime. Zero or
            omitted selects the 24-hour default; values above the 7-day
            cap (604800) or below zero are rejected with a 400.
          type: integer
          format: int64
          example: 86400
    ClientAppInviteResponse:
      description: |-
        ClientAppInviteResponse is the wire shape for an issued invite.

        Token is populated ONLY on the create response — never on the list
        path, since the plaintext is stored only as a SHA-256 hash and is
        unrecoverable afterward. There is deliberately NO id or token_hash
        field: token_hash is the secret redemption key and must never leave
        the server, and exposing no public row handle is also what lets
        revocation be cleanly deferred (there is nothing to revoke by).
      type: object
      properties:
        scope:
          description: |-
            Scope is the invite's redemption scope. Always
            "server_registration" — the only scope the enrollment
            endpoint redeems, and the only one this endpoint mints.
          type: string
          readOnly: true
        created_by_user_id:
          description: |-
            CreatedByUserID is the user id of the enrolled account that
            minted the invite.
          type: string
          format: uuid
          readOnly: true
        token:
          description: |-
            Token is the plaintext invite token the invitee presents to
            POST /v1/client-apps/enroll. Present only on the create
            response: the server stores a SHA-256 hash, so the plaintext
            is unrecoverable afterward and never appears on the list
            path.
          type: string
          readOnly: true
        created_at:
          description: CreatedAt is when the invite was minted.
          type: string
          format: date-time
          readOnly: true
        expires_at:
          description: ExpiresAt is when the invite stops being redeemable.
          type: string
          format: date-time
          readOnly: true
        used_at:
          description: |-
            UsedAt is when the invite was redeemed by an enrollment.
            Omitted while the invite is still outstanding.
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
      required:
        - scope
        - created_by_user_id
        - created_at
        - expires_at
    ClientAppInviteListResponse:
      description: ClientAppInviteListResponse is the envelope for the list endpoint.
      type: object
      properties:
        invites:
          description: |-
            Invites is every invite the caller has minted, newest first,
            including used and expired rows. Token is never present here.
          type: array
          items:
            $ref: '#/components/schemas/ClientAppInviteResponse'
      required:
        - invites
    JourneyCreateRequest:
      description: |-
        JourneyCreateRequest is the minimal wire shape Phase 5 accepts
        for journey creation. Future phases will extend this toward the
        full [opencaravan.Journey] envelope as policy snapshots,
        avatars, and feature flags become first-class.
      type: object
      properties:
        title:
          description: |-
            Title names the journey. Required; leading and trailing
            whitespace is trimmed, and a blank result is rejected with a
            400.
          type: string
          example: Alaska Summer 2027
        description:
          description: |-
            Description is optional free-form prose about the journey.
            Whitespace is trimmed.
          type: string
      required:
        - title
    JourneyResponse:
      description: |-
        JourneyResponse is what the Phase 5 GET and POST handlers
        return. A deliberate subset of [opencaravan.Journey]: enough
        for a client to see the journey identity, state, and timestamps,
        without committing the server to fields it does not yet
        populate meaningfully (origin server URL, deletion policy,
        banner image, etc.). The shape is a server type — not aliased
        to opencaravan.Journey — so the protocol type can evolve
        independently.
      type: object
      properties:
        id:
          description: |-
            ID is the journey's stable identifier: a random version 4
            UUID, server-assigned at creation and immutable.
          type: string
          format: uuid
          readOnly: true
        title:
          description: Title is the journey's display name as supplied by the host.
          type: string
        description:
          description: |-
            Description is the host-supplied prose description. Omitted
            when empty.
          type: string
        host_user_id:
          description: |-
            HostUserID is the user id of the account that created the
            journey and acts as its host participant.
          type: string
          format: uuid
          readOnly: true
        state:
          description: |-
            State is the OpenCaravan journey lifecycle state. Journeys
            are created as "planned"; state transitions are a future
            phase.
          type: string
          enum:
            - planned
            - active
            - closed
            - expired
            - deleted
          readOnly: true
        visibility:
          description: |-
            Visibility controls who can discover the journey. Always
            "private" today — a server-defined value, not yet an
            OpenCaravan protocol enum.
          type: string
          readOnly: true
        creation_time:
          description: CreationTime is when the host created the journey.
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - title
        - host_user_id
        - state
        - visibility
        - creation_time
    TelemetryBatchRequest:
      description: |-
        TelemetryBatchRequest is the wire shape POST
        /v1/journeys/{id}/telemetry accepts. Phase 5 stores the
        envelope (client_batch_id + sample_count + payload digest)
        without expanding individual samples; future phases will
        promote Samples into per-row position_samples inserts.
      type: object
      properties:
        client_batch_id:
          description: |-
            ClientBatchID is the client-chosen idempotency key for this
            batch. Retrying an already-accepted (device, client_batch_id)
            tuple returns a 409 rather than recording a duplicate.
          type: string
        samples:
          description: |-
            Samples are the captured position samples. Phase 5 persists
            the envelope (count + content digest) rather than expanding
            each sample into queryable rows; each sample is still
            protocol-validated on receipt.
          type: array
          items:
            $ref: '#/components/schemas/PositionSample'
        driver_attestation_hash:
          description: |-
            DriverAttestationHash optionally links this batch to the
            [opencaravan.DriverAttestation] that was in effect when the
            samples were captured. When set, the server persists it on
            the telemetry_batches row so a future audit replay can
            downgrade the chain of custody if the linked attestation
            later fails verification. The protocol expects the
            canonical "sha256:<64 lowercase hex>" shape, but the
            telemetry endpoint accepts any non-empty string — strict
            shape enforcement is the audit replay's job.
          type:
            - string
            - "null"
      required:
        - client_batch_id
        - samples
    PositionSample:
      description: PositionSample is one captured participant position update.
      type: object
      properties:
        journey_id:
          type: string
        segment_id:
          type: string
        segment_vehicle_id:
          type: string
        journey_participant_id:
          type: string
        client_app_id:
          type: string
        client_sequence:
          type: integer
          format: int64
        capture_time:
          type: string
          format: date-time
        latitude_e7:
          type: integer
        longitude_e7:
          type: integer
        altitude_mm:
          type:
            - integer
            - "null"
          format: int64
        horizontal_accuracy_mm:
          type:
            - integer
            - "null"
          format: int64
        vertical_accuracy_mm:
          type:
            - integer
            - "null"
          format: int64
        speed_mm_s:
          type:
            - integer
            - "null"
          format: int64
        heading_deg_e2:
          type:
            - integer
            - "null"
        battery_level_permille:
          type:
            - integer
            - "null"
        source:
          type: string
        motion_state:
          type: string
        client_metadata_revision:
          type: string
      required:
        - journey_id
        - segment_id
        - segment_vehicle_id
        - journey_participant_id
        - client_app_id
        - client_sequence
        - capture_time
        - latitude_e7
        - longitude_e7
    TelemetryBatchResponse:
      description: |-
        TelemetryBatchResponse is the ack the handler returns. Carries
        the server-side batch id (so the client can correlate retries
        across logs) and the count of samples the server acknowledged
        receiving.
      type: object
      properties:
        batch_id:
          description: |-
            BatchID is the server-assigned id of the recorded batch, for
            correlating client retries against server logs.
          type: string
          format: uuid
          readOnly: true
        received_count:
          description: |-
            ReceivedCount is the number of samples the server
            acknowledged receiving in this batch.
          type: integer
          format: int64
          readOnly: true
        received_time:
          description: ReceivedTime is when the server recorded the batch.
          type: string
          format: date-time
          readOnly: true
      required:
        - batch_id
        - received_count
        - received_time
    JourneyVehicleCreateRequest:
      description: |-
        JourneyVehicleCreateRequest is the wire shape for POST
        /v1/journeys/{id}/vehicles. With the OpenCaravan 0.2-draft
        transition the journey-scoped Vehicle is metadata-only and the
        AuthorizedDrivers / EmergencyRule fields live on a separate
        VehicleACL bundle, so a participant joining a journey must
        publish BOTH signed bundles atomically: the Vehicle (metadata
        v=1) and the InitialACL (authorization v=1). The server stores
        the canonical bytes of each verbatim and verifies both
        signatures before accepting the create.
      type: object
      properties:
        vehicle:
          description: |-
            Vehicle is the signed metadata bundle (v=1) describing the
            vehicle. Its owner_user_id must match the session user and
            its integrity signature must verify against the owner's
            enrolled signing key.
          allOf:
            - $ref: '#/components/schemas/Vehicle'
        initial_acl:
          description: |-
            InitialACL is the signed authorization bundle (v=1) naming
            the vehicle's authorized drivers. Signed by the same owner
            under the same rules as Vehicle; the pair is accepted or
            rejected atomically.
          allOf:
            - $ref: '#/components/schemas/VehicleACL'
      required:
        - vehicle
        - initial_acl
    Vehicle:
      description: |-
        Vehicle is the journey-scoped, owner-signed metadata bundle for
        a physical vehicle taking part in a trip: who owns the record,
        what the vehicle looks like, what photos to render, and the
        monotonic revision counter the owner increments whenever any
        of that metadata changes.

        Vehicle is intentionally opaque to the server. The protocol
        keeps the vehicle's *descriptive* state — make/model/photos/
        notes — in this signed bundle so any client that holds the
        bundle has the full picture, while the *authorization* state
        (who may drive in this journey, what the emergency fallback
        is) lives on the separate [VehicleACL] type. That split lets
        clients gossip a metadata change (a new photo, a corrected
        model year) independently of an authorization change (adding a
        driver), which matters in the offline-first model where each
        kind of change has different timing and verification needs.

        The journey-scoped Vehicle is constructed by copying display
        name, photos, make/model, and capacity from a [GarageVehicle]
        the user has selected from their persistent garage, then
        publishing it fresh for this journey. There is no wire-level
        link from Vehicle back to its GarageVehicle source.

        Each Vehicle value is one revision in a monotonic chain.
        RevisionVersion starts at 1 and is strictly increasing per ID.
        Revisions are signed by the OwnerUserID's enrolled client cert
        (any of the owner's enrolled apps may sign; edit authority is
        user-scoped, not client-app-scoped). The server retains the
        full revision history so a recipient can audit how a vehicle's
        metadata evolved during the journey.
      type: object
      properties:
        id:
          type: string
        owner_user_id:
          description: |-
            OwnerUserID is the user whose enrolled client cert produced
            Integrity. Permission to publish a new revision is scoped to
            this user, not to a specific client_app.
          type: string
        revision_version:
          description: |-
            RevisionVersion is the monotonic counter for this vehicle's
            metadata bundle. Starts at 1, strictly increases per ID.
            Independent of [VehicleACL.ACLVersion] — metadata and
            authorization version separately.
          type: integer
          format: int64
        revision_time:
          description: |-
            RevisionTime is when the owner signed this revision. Used by
            recipients to render "last updated" and to break ties when
            two revisions arrive concurrently.
          type: string
          format: date-time
        display_name:
          type: string
        make:
          type: string
        model:
          type: string
        model_year:
          type: integer
          format: int64
        color:
          type: string
        capacity:
          description: |-
            Capacity is the total number of possible occupants the
            vehicle can carry, including the driver. A sedan is 5; a
            seven-seat minivan with six seatbelts is 6.
          type: integer
          format: int64
        avatar_blob:
          description: |-
            AvatarBlob references the compact / map-tile photo for this
            vehicle, content-addressed via [BlobRef]. The bytes are
            uploaded to the server's blob layer; multiple Vehicle
            revisions referencing the same photo deduplicate by hash.
          anyOf:
            - $ref: '#/components/schemas/BlobRef'
            - type: "null"
        banner_blob:
          description: |-
            BannerBlob references the wide / detail-view photo, same
            content-addressed model as AvatarBlob.
          anyOf:
            - $ref: '#/components/schemas/BlobRef'
            - type: "null"
        notes:
          description: |-
            Notes is owner-authored free text. Surface in client UIs as
            "owner notes" or similar.
          type: string
        integrity:
          description: |-
            Integrity is the owner's signature over CanonicalEncoding().
            Optional on a draft Vehicle that has not yet been signed;
            required on the wire — the server rejects unsigned uploads.
          anyOf:
            - $ref: '#/components/schemas/Integrity'
            - type: "null"
      required:
        - id
        - owner_user_id
        - revision_version
        - revision_time
        - display_name
        - capacity
    BlobRef:
      description: |-
        BlobRef is a content-addressed reference to an immutable blob of
        bytes hosted (and replicated) by an OpenCaravan server. The hash
        is both the identifier and the integrity check — clients that
        download the bytes can recompute sha256 and reject mismatches
        without needing a separate digest field.

        BlobRef supersedes the URL-based [ImageResourceRef] for fields
        where the bytes themselves are protocol-replicated rather than
        hosted on an external CDN. Used for vehicle avatar/banner photos
        today; the same shape extends to journey photo galleries and
        other shared-media use cases without protocol churn.

        Size and ContentType are carried alongside the hash so a peer
        receiving a bundle can render a placeholder (correct aspect
        ratio, "loading 2.3 MB photo…") before downloading and can
        reject obviously-wrong responses (claimed 5 MB jpeg returns 200
        KB of HTML).
      type: object
      properties:
        hash:
          description: |-
            Hash is the content hash in the canonical "sha256:<64-hex>"
            format used everywhere else in the protocol.
          type: string
        size:
          description: |-
            Size is the byte length of the blob payload. Clients use this
            for placeholders, range-fetch planning, and quota checks.
          type: integer
          format: int64
        content_type:
          description: |-
            ContentType is the IANA media type the uploader supplied,
            e.g., "image/jpeg" or "image/png". Lower-cased on the wire.
          type: string
      required:
        - hash
        - size
        - content_type
    Integrity:
      description: |-
        Integrity describes the signature or message authentication data that makes
        a protocol object tamper-evident.

        Signature covers the canonical encoding of the carrying object excluding the
        Integrity field itself. Algorithm identifies the signature algorithm so a
        verifier can pick the correct primitive. KeyID identifies the issuer key a
        client can use to retrieve the verification public key.

        The same envelope is reused on every signed OpenCaravan object — journey
        invites today, server policy snapshots and future federation introductions
        next — so implementations can share a single signature-verification helper
        rather than re-implementing per object kind.
      type: object
      properties:
        algorithm:
          type: string
        key_id:
          type: string
        signature:
          type: string
      required:
        - algorithm
        - signature
    VehicleACL:
      description: |-
        VehicleACL is the owner-signed payload published whenever the
        authorized-drivers list on a Vehicle changes. Each successive VehicleACL
        for a given vehicle carries a strictly higher ACLVersion, and a server
        or peer verifier retains every published VehicleACL so a DriverAttestation
        can validate against the ACL version that was current at its EffectiveTime
        rather than whatever ACL exists "now."

        Decoupling attestation validity from later ACL revisions is the load-bearing
        piece of the offline-tolerant model: a driver who attested at an earlier
        version is not retroactively unauthorized by a later revocation, and a
        driver who was authorized at attestation time stays authorized when their
        attestation finally syncs.
      type: object
      properties:
        vehicle_id:
          type: string
        owner_user_id:
          type: string
        acl_version:
          type: integer
          format: int64
        authorized_drivers:
          type: array
          items:
            type: string
        emergency_rule:
          anyOf:
            - $ref: '#/components/schemas/VehicleEmergencyRule'
            - type: "null"
        effective_time:
          type: string
          format: date-time
        integrity:
          description: Integrity is the owner's signature over CanonicalEncoding().
          anyOf:
            - $ref: '#/components/schemas/Integrity'
            - type: "null"
      required:
        - vehicle_id
        - owner_user_id
        - acl_version
        - authorized_drivers
        - effective_time
    VehicleEmergencyRule:
      description: |-
        VehicleEmergencyRule names the owner-published fallback semantics for when
        no AuthorizedDrivers participant is available to drive at a waypoint.
        The protocol records the rule so a future server-side or peer verifier can
        apply the same policy across implementations.
      type: object
      properties:
        kind:
          description: Kind names which fallback policy applies.
          type: string
      required:
        - kind
    JourneyVehicleResponse:
      description: |-
        JourneyVehicleResponse is the wire shape the journey-vehicle
        handlers return. Includes the head-pointer projection
        (id/journey/owner/version pointers) AND the latest Vehicle
        metadata bundle decoded from canonical_payload_json so clients
        don't need a separate revision fetch to render the display
        name, photos, capacity, etc. The bundle is exposed verbatim —
        no per-field projection — so clients see whatever the protocol
        version supports.

        Kept as a server type (not an alias for [opencaravan.Vehicle])
        so the protocol type can evolve independently from the
        server's public API surface.
      type: object
      properties:
        id:
          description: |-
            ID is the vehicle's identifier as claimed by the signed
            bundle, scoped to the journey.
          type: string
          format: uuid
          readOnly: true
        journey_id:
          description: JourneyID is the journey this vehicle was uploaded against.
          type: string
          format: uuid
          readOnly: true
        owner_user_id:
          description: |-
            OwnerUserID is the user who signed (and therefore owns) the
            vehicle's bundles.
          type: string
          format: uuid
          readOnly: true
        current_revision_version:
          description: |-
            CurrentRevisionVersion is the head pointer of the vehicle's
            metadata revision chain (monotonically increasing).
          type: integer
          format: int64
          readOnly: true
        current_acl_version:
          description: |-
            CurrentACLVersion is the head pointer of the vehicle's ACL
            revision chain (monotonically increasing).
          type: integer
          format: int64
          readOnly: true
        vehicle:
          description: |-
            Vehicle is the latest signed metadata bundle, decoded from
            the stored canonical bytes verbatim.
          allOf:
            - $ref: '#/components/schemas/Vehicle'
          readOnly: true
        received_at:
          description: |-
            ReceivedAt is when the server accepted the vehicle's
            original create.
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - journey_id
        - owner_user_id
        - current_revision_version
        - current_acl_version
        - vehicle
        - received_at
    JourneyVehicleListResponse:
      description: |-
        JourneyVehicleListResponse is the envelope returned by
        `GET /v1/journeys/{id}/vehicles`. The envelope shape lets future
        phases add pagination metadata or filter cursors without changing
        the field name "vehicles" that clients already index against.
      type: object
      properties:
        vehicles:
          description: |-
            Vehicles is every vehicle uploaded against the journey,
            oldest first.
          type: array
          items:
            $ref: '#/components/schemas/JourneyVehicleResponse'
      required:
        - vehicles
    JourneyVehicleACLRevisionResponse:
      description: |-
        JourneyVehicleACLRevisionResponse is what the ACL append handler
        returns: the revision metadata the client needs to confirm the
        version landed and to render an "ACL changed at $time" entry in a
        vehicle history view.
      type: object
      properties:
        id:
          description: |-
            ID is the server-assigned identifier of the stored ACL
            revision row.
          type: string
          format: uuid
          readOnly: true
        journey_vehicle_id:
          description: JourneyVehicleID is the vehicle this ACL revision belongs to.
          type: string
          format: uuid
          readOnly: true
        acl_version:
          description: |-
            ACLVersion is the revision's version as claimed by the
            signed bundle. It advanced the head pointer, so it is now
            the vehicle's current_acl_version.
          type: integer
          format: int64
          readOnly: true
        effective_time:
          description: |-
            EffectiveTime is when the ACL takes effect, per the signed
            bundle. Trust evaluation consults the ACL in effect at an
            attestation's effective time, not the newest one.
          type: string
          format: date-time
          readOnly: true
        emergency_rule:
          description: |-
            EmergencyRule is the bundle's non-ACL-driver fallback
            policy. Omitted when the bundle carries none (equivalent to
            "none": no fallback, non-ACL drivers record as violations).
          anyOf:
            - $ref: '#/components/schemas/VehicleEmergencyRule'
            - type: "null"
          readOnly: true
        integrity:
          description: |-
            Integrity is the owner's signature envelope over the
            bundle's canonical bytes, echoed as verified and stored.
          allOf:
            - $ref: '#/components/schemas/Integrity'
          readOnly: true
        received_at:
          description: ReceivedAt is when the server accepted this revision.
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - journey_vehicle_id
        - acl_version
        - effective_time
        - integrity
        - received_at
    JourneyVehicleRevisionResponse:
      description: |-
        JourneyVehicleRevisionResponse is what the metadata revision
        append handler returns: the revision metadata plus the decoded
        Vehicle bundle that's now current. Symmetric with
        [JourneyVehicleACLRevisionResponse] but for the metadata side.
      type: object
      properties:
        id:
          description: |-
            ID is the server-assigned identifier of the stored metadata
            revision row.
          type: string
          format: uuid
          readOnly: true
        journey_vehicle_id:
          description: JourneyVehicleID is the vehicle this revision belongs to.
          type: string
          format: uuid
          readOnly: true
        revision_version:
          description: |-
            RevisionVersion is the revision's version as claimed by the
            signed bundle. It advanced the head pointer, so it is now
            the vehicle's current_revision_version.
          type: integer
          format: int64
          readOnly: true
        revision_time:
          description: |-
            RevisionTime is the bundle's self-declared revision
            timestamp.
          type: string
          format: date-time
          readOnly: true
        vehicle:
          description: Vehicle is the decoded metadata bundle that is now current.
          allOf:
            - $ref: '#/components/schemas/Vehicle'
          readOnly: true
        received_at:
          description: ReceivedAt is when the server accepted this revision.
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - journey_vehicle_id
        - revision_version
        - revision_time
        - vehicle
        - received_at
    DriverAttestation:
      description: |-
        DriverAttestation is the per-handoff signed payload a journey participant
        produces when taking over driving a vehicle at a waypoint. It is the unit
        of offline-tolerant authorization: a participant signs the attestation with
        their enrolled client cert, gossips it to other passengers over a peer
        transport, and any device that later reaches the server uploads the
        accumulated batch.

        The server replays each attestation: it verifies Integrity against the
        driver's enrolled cert, looks up the [VehicleACL] for ACLVersionConsulted,
        and checks that DriverUserID is in that ACL's AuthorizedDrivers list. An
        attestation against a since-revoked ACL is honored if the ACL was valid
        at the attestation's recorded version; a non-ACL driver is recorded with
        a downgraded trust flag when the vehicle's emergency rule permits it,
        rejected as an ACL violation otherwise. The server never deletes the
        recorded payload — chain of custody is information, not a gate.

        PriorAttestationHash optionally chains to the previous attestation the
        driver knew about (typically gossiped from the prior driver before they
        went offline). It is sha256:<lowercase hex of the SHA-256 of the prior
        attestation's CanonicalEncoding>. Two attestations sharing the same
        PriorAttestationHash signal a fork that the server flags and surfaces;
        when missing or unresolvable, ordering falls back to EffectiveTime.
      type: object
      properties:
        vehicle_id:
          type: string
        segment_id:
          type: string
        driver_user_id:
          type: string
        effective_time:
          type: string
          format: date-time
        acl_version_consulted:
          type: integer
          format: int64
        prior_attestation_hash:
          type:
            - string
            - "null"
        integrity:
          description: Integrity is the driver's signature over CanonicalEncoding().
          anyOf:
            - $ref: '#/components/schemas/Integrity'
            - type: "null"
      required:
        - vehicle_id
        - segment_id
        - driver_user_id
        - effective_time
        - acl_version_consulted
    DriverAttestationResponse:
      description: |-
        DriverAttestationResponse is the wire shape the
        driver-attestation handlers return. A deliberate subset of
        [opencaravan.DriverAttestation] augmented with the
        server-computed trust_flag and fork-detection metadata.
      type: object
      properties:
        id:
          description: |-
            ID is the server-assigned identifier of the stored
            attestation row.
          type: string
          format: uuid
          readOnly: true
        journey_vehicle_id:
          description: |-
            JourneyVehicleID is the vehicle whose wheel the driver
            attested to taking.
          type: string
          format: uuid
          readOnly: true
        segment_id:
          description: |-
            SegmentID is the journey segment the attestation applies to,
            per the signed payload. Opaque at this layer: the server does
            not yet verify the segment exists.
          type: string
          format: uuid
          readOnly: true
        driver_user_id:
          description: |-
            DriverUserID is the user who signed the attestation —
            drivers attest to their own handoffs, so this always matches
            the submitting session's user.
          type: string
          format: uuid
          readOnly: true
        effective_time:
          description: |-
            EffectiveTime is when the driver took the wheel, per the
            signed payload. The (vehicle, driver, effective_time) tuple
            is the replay key: a gossiped duplicate returns the existing
            record with 200 instead of 409.
          type: string
          format: date-time
          readOnly: true
        acl_version_consulted:
          description: |-
            ACLVersionConsulted is the ACL revision the server's trust
            evaluator consulted — the one in effect at EffectiveTime,
            not necessarily the newest.
          type: integer
          format: int64
          readOnly: true
        prior_attestation_hash:
          description: |-
            PriorAttestationHash is the canonical hash
            ("sha256:<64 lowercase hex>") of the predecessor attestation
            in the handoff chain. Omitted on a chain root (the vehicle's
            first driver).
          type:
            - string
            - "null"
          readOnly: true
        trust_flag:
          description: |-
            TrustFlag is the server-evaluated trust outcome: the driver
            was in the consulted ACL (authorized), permitted only by the
            vehicle's emergency fallback rule (emergency_fallback), or
            neither — retained as evidence but untrusted (acl_violation).
          type: string
          enum:
            - authorized
            - emergency_fallback
            - acl_violation
          readOnly: true
        integrity:
          description: |-
            Integrity is the driver's signature envelope over the
            attestation's canonical bytes.
          allOf:
            - $ref: '#/components/schemas/Integrity'
          readOnly: true
        received_at:
          description: ReceivedAt is when the server recorded the attestation.
          type: string
          format: date-time
          readOnly: true
        fork_siblings:
          description: |-
            ForkSiblings names other attestations that share this
            attestation's prior_attestation_hash. Populated only on the
            POST response so the submitting client can immediately see
            when their handoff conflicts with a peer's; the list
            includes the just-recorded record so a single-element list
            means "you're the only claimant on this predecessor."
          type: array
          items:
            $ref: '#/components/schemas/DriverAttestationForkSibling'
      required:
        - id
        - journey_vehicle_id
        - segment_id
        - driver_user_id
        - effective_time
        - acl_version_consulted
        - trust_flag
        - integrity
        - received_at
    DriverAttestationForkSibling:
      description: |-
        DriverAttestationForkSibling is a compact descriptor of a fork
        sibling: enough to identify who else claimed the same
        predecessor and when, without exposing the full payload.
      type: object
      properties:
        id:
          description: ID is the sibling attestation's server-assigned identifier.
          type: string
          format: uuid
          readOnly: true
        driver_user_id:
          description: |-
            DriverUserID is the user the sibling attestation names as
            driver.
          type: string
          format: uuid
          readOnly: true
        effective_time:
          description: |-
            EffectiveTime is when the sibling claims its driver took the
            wheel.
          type: string
          format: date-time
          readOnly: true
        trust_flag:
          description: TrustFlag is the sibling's server-evaluated trust outcome.
          type: string
          enum:
            - authorized
            - emergency_fallback
            - acl_violation
          readOnly: true
      required:
        - id
        - driver_user_id
        - effective_time
        - trust_flag
    DriverAttestationListResponse:
      description: |-
        DriverAttestationListResponse is the envelope returned by the
        GET handler. Envelope shape so future phases can add pagination
        or filter metadata without breaking clients indexing on
        "attestations".
      type: object
      properties:
        attestations:
          description: |-
            Attestations is every recorded attestation for the vehicle,
            ordered by effective_time ascending. Low-trust rows are
            included; filter on trust_flag to show only authorized
            drivers.
          type: array
          items:
            $ref: '#/components/schemas/DriverAttestationResponse'
      required:
        - attestations
    CurrentDriverResponse:
      description: |-
        CurrentDriverResponse is what the current-driver endpoint
        returns. Carries the attestation the server picked as "in
        effect at the queried time" plus any fork siblings that share
        the picked attestation's prior_attestation_hash — so clients
        can render "right now you're being attributed to driver X, but
        also driver Y has a competing claim on the same predecessor."

        AsOf echoes the resolved query timestamp so the response is
        auditable when the caller didn't supply one (server used
        time.Now()).
      type: object
      properties:
        as_of:
          description: |-
            AsOf is the resolved query timestamp the answer is relative
            to: the ?at value when supplied, otherwise the server's
            current time.
          type: string
          format: date-time
          readOnly: true
        attestation:
          description: |-
            Attestation is the driver attestation in effect at AsOf —
            the highest effective_time at or before it, ties broken by
            most recently received.
          allOf:
            - $ref: '#/components/schemas/DriverAttestationResponse'
          readOnly: true
        fork_siblings:
          description: |-
            ForkSiblings names competing attestations sharing the picked
            attestation's prior_attestation_hash, so clients can surface
            a conflicting handoff claim. Omitted when there is no fork.
          type: array
          items:
            $ref: '#/components/schemas/DriverAttestationForkSibling'
          readOnly: true
      required:
        - as_of
        - attestation
    Garage:
      description: |-
        Garage is the account-scoped, persistent, multi-owner container that holds
        a user's library of [GarageVehicle] entries. A user with a single account
        usually has a single garage; users in a household share a single garage by
        having multiple Owners. A user may participate in multiple garages — one
        household garage shared with their spouse, one project-car garage shared
        with weekend track buddies, and so on.

        Each Garage value is one revision in a monotonic chain. Revisions are
        signed by any current Owner, so any owner may add or remove other owners,
        rename the garage, or otherwise edit the container. The server retains the
        full revision history; the current state is the latest revision whose
        invited Owners have all accepted (pending acceptances are visible to the
        invitee but the revision is not yet active).

        Ownership additions require recipient consent via [GarageOwnershipAcceptance]
        — a co-owner cannot be added unilaterally, which prevents an attacker
        from spamming unwanted entries into another user's garage. Ownership
        removals are unilateral: any current owner may remove any other owner.
        This matches the household trust model; the protocol's answer to a lost
        or compromised account is "an existing co-owner removes it from the
        garage" rather than "no one can ever remove this account."
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        revision_version:
          type: integer
          format: int64
        revision_time:
          type: string
          format: date-time
        owners:
          type: array
          items:
            $ref: '#/components/schemas/GarageOwner'
        signed_by:
          type: string
        integrity:
          anyOf:
            - $ref: '#/components/schemas/Integrity'
            - type: "null"
      required:
        - id
        - name
        - revision_version
        - revision_time
        - owners
        - signed_by
    GarageOwner:
      description: |-
        GarageOwner names one user's ownership stake in a Garage. AcceptedTime is
        nil while the invitation is pending; non-nil once the recipient has
        published a matching [GarageOwnershipAcceptance].

        A garage revision in which a new owner is added with AcceptedTime nil
        represents a pending invitation: the recipient sees it in their app and
        may accept or decline; non-recipients do not see the garage at all.
        Once the recipient accepts, a subsequent revision updates AcceptedTime
        (or the server materializes the accepted state without a new revision —
        see docs/vehicles.md for the wire-level options).
      type: object
      properties:
        user_id:
          type: string
        added_time:
          type: string
          format: date-time
        accepted_time:
          type:
            - string
            - "null"
          format: date-time
      required:
        - user_id
        - added_time
    GarageResponse:
      description: |-
        GarageResponse is the wire shape the garage handlers return.
        Owners is the materialized current owner list (accepted +
        pending); clients render pending invitations with reduced
        affordance until acceptance.
      type: object
      properties:
        id:
          description: |-
            ID is the garage's identifier as claimed by the signed
            Garage payload at creation.
          type: string
          format: uuid
          readOnly: true
        name:
          description: |-
            Name is the garage's display name from the current head
            revision.
          type: string
          readOnly: true
        current_revision_version:
          description: |-
            CurrentRevisionVersion is the head pointer of the garage's
            revision chain (monotonically increasing).
          type: integer
          format: int64
          readOnly: true
        current_revision_time:
          description: |-
            CurrentRevisionTime is the head revision's self-declared
            revision timestamp.
          type: string
          format: date-time
          readOnly: true
        created_at:
          description: CreatedAt is when the server accepted the garage's create.
          type: string
          format: date-time
          readOnly: true
        owners:
          description: |-
            Owners is the materialized current owner list, accepted and
            pending alike.
          type: array
          items:
            $ref: '#/components/schemas/GarageOwnerResponse'
          readOnly: true
      required:
        - id
        - name
        - current_revision_version
        - current_revision_time
        - created_at
        - owners
    GarageOwnerResponse:
      description: |-
        GarageOwnerResponse is the wire shape of one materialized
        owner row. AcceptedTime is nil while the invitation is pending.
      type: object
      properties:
        user_id:
          description: UserID is the owner's user id.
          type: string
          format: uuid
          readOnly: true
        added_time:
          description: |-
            AddedTime is when a garage revision first named this user as
            an owner.
          type: string
          format: date-time
          readOnly: true
        accepted_time:
          description: |-
            AcceptedTime is when the user accepted ownership. Omitted
            while the invitation is still pending — pending owners hold
            no mutation authority.
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
      required:
        - user_id
        - added_time
    GarageListResponse:
      description: GarageListResponse is the envelope for GET /v1/garages.
      type: object
      properties:
        garages:
          description: |-
            Garages is every garage in which the caller appears as an
            owner, accepted or pending.
          type: array
          items:
            $ref: '#/components/schemas/GarageResponse'
      required:
        - garages
    GarageRevisionAppendResponse:
      description: |-
        GarageRevisionAppendResponse is what the revision POST returns —
        the revision metadata plus the new garage head state so the
        client doesn't need to follow up with a GET.
      type: object
      properties:
        revision_id:
          description: |-
            RevisionID is the server-assigned identifier of the stored
            revision row.
          type: string
          format: uuid
          readOnly: true
        garage_id:
          description: GarageID is the garage the revision was appended to.
          type: string
          format: uuid
          readOnly: true
        revision_version:
          description: |-
            RevisionVersion is the revision's version as claimed by the
            signed payload. It advanced the head pointer, so it is now
            the garage's current_revision_version.
          type: integer
          format: int64
          readOnly: true
        revision_time:
          description: |-
            RevisionTime is the payload's self-declared revision
            timestamp.
          type: string
          format: date-time
          readOnly: true
        integrity:
          description: |-
            Integrity is the signing owner's signature envelope over the
            payload's canonical bytes.
          allOf:
            - $ref: '#/components/schemas/Integrity'
          readOnly: true
        received_at:
          description: ReceivedAt is when the server accepted the revision.
          type: string
          format: date-time
          readOnly: true
        garage:
          description: |-
            Garage is the garage's head state after the append, owner
            list reconciled — no follow-up GET needed.
          allOf:
            - $ref: '#/components/schemas/GarageResponse'
          readOnly: true
      required:
        - revision_id
        - garage_id
        - revision_version
        - revision_time
        - integrity
        - received_at
        - garage
    GarageOwnershipAcceptance:
      description: |-
        GarageOwnershipAcceptance is the signed acknowledgement a newly-invited
        user publishes to accept a pending garage co-ownership invitation. The
        acceptance binds to a specific Garage revision (the revision in which
        the recipient was first added with AcceptedTime nil); replaying it
        against a different revision is rejected on a version mismatch.
      type: object
      properties:
        garage_id:
          type: string
        revision_version_accepted:
          type: integer
          format: int64
        accepter_user_id:
          type: string
        accepted_time:
          type: string
          format: date-time
        integrity:
          anyOf:
            - $ref: '#/components/schemas/Integrity'
            - type: "null"
      required:
        - garage_id
        - revision_version_accepted
        - accepter_user_id
        - accepted_time
    GarageOwnershipAcceptanceResponse:
      description: |-
        GarageOwnershipAcceptanceResponse is what the acceptance POST
        returns — the recorded acceptance metadata plus the updated
        garage state.
      type: object
      properties:
        acceptance_id:
          description: |-
            AcceptanceID is the server-assigned identifier of the stored
            acceptance row.
          type: string
          format: uuid
          readOnly: true
        garage_id:
          description: GarageID is the garage whose ownership was accepted.
          type: string
          format: uuid
          readOnly: true
        revision_version_accepted:
          description: |-
            RevisionVersionAccepted is the garage revision version the
            signed acceptance is bound to — the owner list the accepter
            actually saw.
          type: integer
          format: int64
          readOnly: true
        accepted_time:
          description: |-
            AcceptedTime is the acceptance's self-declared timestamp. A
            replay of the same (garage, accepter, revision) acceptance
            returns the stored record with 200 instead of 201.
          type: string
          format: date-time
          readOnly: true
        integrity:
          description: |-
            Integrity is the accepter's signature envelope over the
            acceptance's canonical bytes.
          allOf:
            - $ref: '#/components/schemas/Integrity'
          readOnly: true
        received_at:
          description: ReceivedAt is when the server recorded the acceptance.
          type: string
          format: date-time
          readOnly: true
        garage:
          description: |-
            Garage is the garage's head state after the acceptance, with
            the accepter's owner row now marked accepted.
          allOf:
            - $ref: '#/components/schemas/GarageResponse'
          readOnly: true
      required:
        - acceptance_id
        - garage_id
        - revision_version_accepted
        - accepted_time
        - integrity
        - received_at
        - garage
    GarageVehicle:
      description: |-
        GarageVehicle is one vehicle entry in a [Garage]'s library. Persistent
        across journeys (unlike the journey-scoped [Vehicle]), and editable by
        any current accepted owner of its containing garage.

        GarageVehicle carries the vehicle's identity — what it is, what it looks
        like, who knows what about it — at the household level. The per-journey
        authorization model (who may drive it in a particular trip) lives on the
        journey-scoped [Vehicle] that participants upload when joining a journey.
        A client's "import this car into the journey" action copies relevant
        metadata from a GarageVehicle into a fresh Vehicle at upload time; there
        is no wire-level link between the two on a journey participant's view, so
        non-owner participants cannot correlate the same garage car appearing in
        multiple journeys. Cross-journey history aggregation for an owner's own
        view is downstream of this PR.

        Each GarageVehicle value is one revision in a monotonic chain. Revisions
        are signed by any current accepted owner of the containing garage; any
        owner may edit any vehicle in the garage. The server retains the full
        revision history.
      type: object
      properties:
        id:
          type: string
        garage_id:
          type: string
        revision_version:
          type: integer
          format: int64
        revision_time:
          type: string
          format: date-time
        display_name:
          type: string
        make:
          type: string
        model:
          type: string
        model_year:
          type: integer
          format: int64
        color:
          type: string
        capacity:
          type: integer
          format: int64
        avatar_blob:
          description: |-
            AvatarBlob references the compact / map-tile photo via
            the protocol's content-addressed blob layer. See [BlobRef].
          anyOf:
            - $ref: '#/components/schemas/BlobRef'
            - type: "null"
        banner_blob:
          description: |-
            BannerBlob references the wide / detail-view photo via the
            content-addressed blob layer.
          anyOf:
            - $ref: '#/components/schemas/BlobRef'
            - type: "null"
        notes:
          type: string
        signed_by:
          description: |-
            SignedBy names which current garage owner produced Integrity. The
            server cross-checks against the named garage's owner list at
            RevisionTime to confirm the signer was an accepted owner then.
          type: string
        integrity:
          anyOf:
            - $ref: '#/components/schemas/Integrity'
            - type: "null"
      required:
        - id
        - garage_id
        - revision_version
        - revision_time
        - display_name
        - capacity
        - signed_by
    GarageVehicleResponse:
      description: |-
        GarageVehicleResponse is the wire shape the garage vehicle
        handlers return. Includes the head-pointer projection plus the
        latest GarageVehicle bundle decoded from canonical_payload_json
        so clients see whatever fields the protocol version supports
        without per-attribute projection on the server side.
      type: object
      properties:
        id:
          description: |-
            ID is the vehicle's identifier as claimed by the signed
            bundle, scoped to the garage.
          type: string
          format: uuid
          readOnly: true
        garage_id:
          description: GarageID is the garage whose library holds the vehicle.
          type: string
          format: uuid
          readOnly: true
        current_revision_version:
          description: |-
            CurrentRevisionVersion is the head pointer of the vehicle's
            revision chain (monotonically increasing).
          type: integer
          format: int64
          readOnly: true
        garage_vehicle:
          description: |-
            GarageVehicle is the latest signed bundle, decoded from the
            stored canonical bytes verbatim.
          allOf:
            - $ref: '#/components/schemas/GarageVehicle'
          readOnly: true
        received_at:
          description: |-
            ReceivedAt is when the server accepted the vehicle's
            original create.
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - garage_id
        - current_revision_version
        - garage_vehicle
        - received_at
    GarageVehicleListResponse:
      description: |-
        GarageVehicleListResponse is the envelope for GET
        /v1/garages/{id}/vehicles. Envelope shape so future phases can
        add filter metadata.
      type: object
      properties:
        vehicles:
          description: |-
            Vehicles is every vehicle in the garage's library, oldest
            first.
          type: array
          items:
            $ref: '#/components/schemas/GarageVehicleResponse'
      required:
        - vehicles
    GarageInviteCreateRequest:
      description: |-
        GarageInviteCreateRequest is the POST body for issuing an invite.
        All fields are optional and have sensible defaults.
      type: object
      properties:
        expires_in_seconds:
          description: |-
            ExpiresInSeconds is the requested invite lifetime. Zero or
            omitted selects the 7-day default; values above the 30-day
            cap (2592000) are rejected with a 400.
          type: integer
          format: int64
          example: 604800
        max_redemptions:
          description: |-
            MaxRedemptions is how many distinct redemptions the token
            permits. Zero or omitted selects single-use.
          type: integer
          format: int64
          example: 1
    GarageInviteResponse:
      description: |-
        GarageInviteResponse is the wire shape for a garage invite.
        Token is populated ONLY on the create response — never on list
        or any subsequent read, since the plaintext is stored only as a
        SHA-256 hash.
      type: object
      properties:
        id:
          description: |-
            ID is the invite's server-assigned identifier — the handle
            the revoke endpoint takes.
          type: string
          format: uuid
          readOnly: true
        garage_id:
          description: GarageID is the garage the invite grants ownership of.
          type: string
          format: uuid
          readOnly: true
        created_by_user_id:
          description: CreatedByUserID is the accepted owner who minted the invite.
          type: string
          format: uuid
          readOnly: true
        token:
          description: |-
            Token is the plaintext invite token the invitee presents to
            POST /v1/garage-invites/redeem. Present only on the create
            response: the server stores a SHA-256 hash, so the plaintext
            is unrecoverable afterward and never appears on the list
            path.
          type: string
          readOnly: true
        created_at:
          description: CreatedAt is when the invite was minted.
          type: string
          format: date-time
          readOnly: true
        expires_at:
          description: ExpiresAt is when the invite stops being redeemable.
          type: string
          format: date-time
          readOnly: true
        max_redemptions:
          description: |-
            MaxRedemptions is how many distinct redemptions the token
            permits.
          type: integer
          format: int64
          readOnly: true
        redemption_count:
          description: |-
            RedemptionCount is how many redemptions have been recorded
            so far. The invite is exhausted when it reaches
            max_redemptions.
          type: integer
          format: int64
          readOnly: true
        revoked_at:
          description: |-
            RevokedAt is when an owner revoked the invite. Omitted while
            the invite is not revoked; a revoked invite can no longer be
            redeemed regardless of expiry or remaining redemptions.
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
      required:
        - id
        - garage_id
        - created_by_user_id
        - created_at
        - expires_at
        - max_redemptions
        - redemption_count
    GarageInviteListResponse:
      description: GarageInviteListResponse is the envelope for the list endpoint.
      type: object
      properties:
        invites:
          description: |-
            Invites is every invite ever issued for the garage,
            including expired, revoked, and exhausted rows. Token is
            never present here.
          type: array
          items:
            $ref: '#/components/schemas/GarageInviteResponse'
      required:
        - invites
    GarageInviteRedeemRequest:
      description: |-
        GarageInviteRedeemRequest is the POST body for the redeem
        endpoint. Token is in the body (not the URL path) so it doesn't
        leak into access logs, proxy logs, or browser history.
      type: object
      properties:
        token:
          description: |-
            Token is the plaintext invite token as handed to the invitee
            by an owner. It is the entire proof of authority — any
            authenticated user holding it becomes an accepted owner.
          type: string
      required:
        - token
    GarageInviteRedeemResponse:
      description: |-
        GarageInviteRedeemResponse is what the redeem handler returns:
        the redemption metadata plus the updated garage state so the
        client can render "you're in" without a follow-up GET.
      type: object
      properties:
        redemption_id:
          description: |-
            RedemptionID is the server-assigned identifier of the
            recorded redemption.
          type: string
          format: uuid
          readOnly: true
        garage_invite_id:
          description: GarageInviteID is the invite the token resolved to.
          type: string
          format: uuid
          readOnly: true
        redeemed_at:
          description: RedeemedAt is when the server recorded the redemption.
          type: string
          format: date-time
          readOnly: true
        garage:
          description: |-
            Garage is the garage's head state with the redeemer now an
            accepted owner — no follow-up GET needed.
          allOf:
            - $ref: '#/components/schemas/GarageResponse'
          readOnly: true
      required:
        - redemption_id
        - garage_invite_id
        - redeemed_at
        - garage
